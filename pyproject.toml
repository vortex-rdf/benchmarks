[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vortex-rdf-benchmarks"
version = "0.1.0"
description = "Standalone contracts and tools for vortex-rdf benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Vortex RDF"}]
dependencies = []

[project.scripts]
vortex-rdf-bench = "benchmark_core.cli:main"

[tool.setuptools.packages.find]
include = ["benchmark_core*", "DBBench*", "BSBM*"]